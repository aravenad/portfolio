<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    Le D reprend le lettrage chromé du hero : un dégradé argent, éclairé depuis
    le haut à gauche. Les arrêts sont plus contrastés qu'en grand format — à
    16 px, un dégradé doux se lirait comme un aplat gris.
  -->
  <linearGradient id="chrome" x1="0" y1="0" x2="0.45" y2="1">
    <stop offset="0" stop-color="#ffffff" />
    <stop offset="0.38" stop-color="#a1a1aa" />
    <stop offset="0.58" stop-color="#fafafa" />
    <stop offset="1" stop-color="#71717a" />
  </linearGradient>

  <rect width="32" height="32" rx="7" fill="#09090B" />
  <path
    fill="url(#chrome)"
    fill-rule="evenodd"
    d="M9 6h7a10 10 0 0 1 0 20H9V6Zm4 4v12h3a6 6 0 0 0 0-12h-3Z"
  />
</svg>
