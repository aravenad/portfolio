<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!--
    Logo Java, repris de devicon (jeu `devicon-plain`, licence MIT).

    simple-icons ne publie pas de logo Java : la marque est déposée et le jeu ne
    la redistribue pas — vérifié, aucune icône `java` parmi ses 3 733.

    Le tracé d'origine est sur un viewBox de 128. Il a été remis à l'échelle sur
    24, celui de simple-icons, pour que la correction de poids optique de
    SkillTile.astro (`stroke-width: 0.35`, exprimée en unités de viewBox)
    s'applique ici comme aux autres logos au trait.

    La mise à l'échelle est exacte : le tracé n'emploie que M/m/C/c/S/s, donc
    aucun arc, aucun drapeau ni angle à préserver — tout nombre est une longueur.
    Rendus à 600 px, l'original et cette version ne diffèrent sur aucun pixel
    hors anticrénelage de bord.

    ⚠️ Les nombres sont séparés par des espaces et doivent le rester. La grammaire
    SVG tolère `2.155.181` pour deux nombres, mais s'appuyer là-dessus rend le
    tracé illisible et piégeux à éditer.

    Ce fichier vit dans src/icons/, chargé nativement par astro-icon : aucune
    dépendance ajoutée, et l'avertissement "Failed to load icons from
    src/icons" du build disparaît par la même occasion.
  -->
