# Tests, build, puis publication sur GitHub Pages. Un job qui échoue arrête la
# chaîne : le site en ligne reste alors la version précédente.
# Vue d'ensemble : §7 de docs/ARCHITECTURE.md.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Permet de relancer un déploiement depuis l'onglet Actions.
  workflow_dispatch:

# Rien par défaut : chaque job demande le strict nécessaire. Le job de build
# n'avait aucun usage de `pages: write` ni du jeton OIDC, et c'est lui qui
# exécute le code des dépendances.
permissions: {}

# Un seul déploiement à la fois, sans annuler celui qui est en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        # Les actions sont épinglées par empreinte de commit : un tag peut être
        # redéplacé sur un autre commit, une empreinte non. Dependabot les tient
        # à jour et rappelle la version en commentaire.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Le même défaut que withastro/action, qui construit ensuite.
          node-version: '24'
          cache: npm

      - name: Install
        # `npm ci` installe exactement le lockfile, sans le réécrire.
        run: npm ci

      - name: Audit
        # Échoue sur une faille connue de gravité haute ou critique dans ce qui
        # part réellement en production.
        run: npm audit --omit=dev --audit-level=high

      - name: Test
        run: npm run coverage

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build
        # Sans `node-version`, l'action suit son défaut (24). package.json
        # exige >= 22.12.0, les deux conviennent.
        uses: withastro/action@3eafd002e65cc31b4f0eae0bb05450d521562247 # v6

  deploy:
    needs: build
    # Une pull request est vérifiée et construite, mais jamais publiée.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
