<!doctype html>
<meta charset="utf-8" />
<!--
  Source de public/og-v5.png. Rendue par Chrome headless plutôt qu'avec les
  primitives ImageMagick : la mise en page reprend telle quelle celle du site
  (mêmes couleurs, même matière, même lettrage chromé), et le texte est composé
  par un vrai moteur de rendu. Commande de rendu : §10 de DOCUMENTATION.md.

  ⚠️ CETTE CARTE EST REGARDÉE PETITE. LinkedIn la réduit à ~520px de large et la
  réencode en JPEG. Deux règles en découlent, apprises en ratant la v4 :

  1. LA MATIÈRE NE PASSE PAS DERRIÈRE LE TEXTE. Le fondu s'éteint avant le titre,
     qui se pose sur du noir franc. Sur une matière fine, les bords des lettres
     perdent leur contraste local, le JPEG y concentre ses artefacts, et la carte
     paraît floue — même rendue en 2400 × 1260. Le sous-titre gris tombait à
     2,6:1 contre le pixel le plus clair sous lui.

  2. LE MOTIF EST AGRANDI. `--chrome-width: 1800px` pour une carte de 1200px, là
     où le site prend `max(64rem, 100vw)` : les plis deviennent larges au lieu
     d'être un filigrane. Le filigrane, réduit à 520px, tourne en bouillie ; les
     grands plis survivent. C'est un écart assumé au cadrage du site — la carte
     ne se regarde pas dans les mêmes conditions que l'accueil.

  Le décalage vertical suit le même facteur -0.87 que global.css, appliqué à
  cette largeur : le motif reste celui de l'accueil, pris de plus près.

  Contraste mesuré sur le rendu, contre le pixel le plus clair sous chaque bloc :
  titre 19,9:1 (13,5:1 sur le stop le plus sombre du lettrage), sous-titre 7,8:1.
  L'ancienne carte, sur la matière procédurale, était à 13,8 / 9,4 / 6,5.

  ⚠️ Le fondu est un dégradé CSS et non le masque du site (`chrome-fade.webp`,
  tiré de `tools/chrome-fade/chrome-fade.svg`). Rendue en `file://`, la page ne
  pouvait pas charger le masque SVG externe d'alors : Chrome
  n'en fait pas un masque neutre, il masque tout, et la matière disparaît
  entièrement sans le moindre avertissement.
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    --chrome-width: 1800px;

    width: 1200px;
    height: 630px;
    overflow: hidden;
    position: relative;
    background-color: #09090b;
    background-image: radial-gradient(48rem 26rem at 50% -8rem, #cfe0f314, transparent 68%);
    background-repeat: no-repeat;
    background-position: top center;

    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 22px;
    padding: 0 88px;

    color: #fafafa;
    font: 400 46px/1.25 "Inter", "Roboto", ui-sans-serif, system-ui, sans-serif;
    letter-spacing: -0.02em;
  }

  body::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image: url("../src/assets/chrome-original-hq.webp");
    background-repeat: no-repeat;
    background-position: center calc(var(--chrome-width) * -0.87);
    background-size: var(--chrome-width) auto;
    mix-blend-mode: screen;
    opacity: 0.7;
    /* Éteint à 34 % : le titre commence à 36,7 % de la hauteur de la carte. */
    mask-image: linear-gradient(to bottom, #000 0%, #000 14%, transparent 34%);
  }

  /* Le texte repasse devant le calque, que `position: absolute` a détaché. */
  .rule, h1, p { position: relative; }

  /* Le filet chromé, transposition du trait d'accent de l'ancienne version. */
  .rule {
    width: 132px;
    height: 4px;
    border-radius: 2px;
    background-image: linear-gradient(90deg, #ffffff, #a1a1aa, #52525b);
  }

  h1 {
    font-size: 92px;
    font-weight: 700;
    letter-spacing: -0.035em;
    background-image: linear-gradient(
      172deg, #ffffff 0%, #ffffff 46%, #a1a1aa 63%, #f4f4f5 78%, #d4d4d8 100%
    );
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  p { color: #a1a1aa; }

  /*
   * Pas de grain ici, contrairement au site : un bruit par pixel sur 2400 px
   * fait passer le PNG de 0,1 à 1,2 Mo, et LinkedIn recompresse de toute façon.
   * Il aggraverait aussi le point 1 ci-dessus.
   */
</style>

<div class="rule"></div>
