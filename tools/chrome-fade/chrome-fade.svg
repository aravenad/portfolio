<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1024" viewBox="0 0 1600 1024" preserveAspectRatio="none">
  <!-- Gaussian falloff: a continuous slope, fading well before the bottom edge.
       Low amplitude displacement breaks up horizontal bands without touching
       the source image or blurring its metallic detail. -->
  <defs>
    <linearGradient id="falloff" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="1024">
      <stop offset="0.0%" stop-color="white" stop-opacity="1.000000"/>
      <stop offset="2.5%" stop-color="white" stop-opacity="0.987024"/>
      <stop offset="5.0%" stop-color="white" stop-opacity="0.949096"/>
      <stop offset="7.5%" stop-color="white" stop-opacity="0.889095"/>
      <stop offset="10.0%" stop-color="white" stop-opacity="0.811412"/>
      <stop offset="12.5%" stop-color="white" stop-opacity="0.721422"/>
      <stop offset="15.0%" stop-color="white" stop-opacity="0.624875"/>
      <stop offset="17.5%" stop-color="white" stop-opacity="0.527292"/>
      <stop offset="20.0%" stop-color="white" stop-opacity="0.433476"/>
      <stop offset="22.5%" stop-color="white" stop-opacity="0.347164"/>
      <stop offset="25.0%" stop-color="white" stop-opacity="0.270868"/>
      <stop offset="27.5%" stop-color="white" stop-opacity="0.205891"/>
      <stop offset="30.0%" stop-color="white" stop-opacity="0.152466"/>
      <stop offset="32.5%" stop-color="white" stop-opacity="0.109992"/>
      <stop offset="35.0%" stop-color="white" stop-opacity="0.077305"/>
      <stop offset="37.5%" stop-color="white" stop-opacity="0.052931"/>
      <stop offset="40.0%" stop-color="white" stop-opacity="0.035307"/>
      <stop offset="42.5%" stop-color="white" stop-opacity="0.022944"/>
      <stop offset="45.0%" stop-color="white" stop-opacity="0.014526"/>
      <stop offset="47.5%" stop-color="white" stop-opacity="0.008959"/>
      <stop offset="50.0%" stop-color="white" stop-opacity="0.005383"/>
      <stop offset="52.5%" stop-color="white" stop-opacity="0.003151"/>
      <stop offset="55.0%" stop-color="white" stop-opacity="0.001797"/>
      <stop offset="57.5%" stop-color="white" stop-opacity="0.000998"/>
      <stop offset="60.0%" stop-color="white" stop-opacity="0.000540"/>
      <stop offset="62.5%" stop-color="white" stop-opacity="0.000285"/>
      <stop offset="65.0%" stop-color="white" stop-opacity="0.000146"/>
      <stop offset="67.5%" stop-color="white" stop-opacity="0"/>
      <stop offset="70.0%" stop-color="white" stop-opacity="0"/>
      <stop offset="72.5%" stop-color="white" stop-opacity="0"/>
      <stop offset="75.0%" stop-color="white" stop-opacity="0"/>
      <stop offset="77.5%" stop-color="white" stop-opacity="0"/>
      <stop offset="80.0%" stop-color="white" stop-opacity="0"/>
      <stop offset="82.5%" stop-color="white" stop-opacity="0"/>
      <stop offset="85.0%" stop-color="white" stop-opacity="0"/>
      <stop offset="87.5%" stop-color="white" stop-opacity="0"/>
      <stop offset="90.0%" stop-color="white" stop-opacity="0"/>
      <stop offset="92.5%" stop-color="white" stop-opacity="0"/>
      <stop offset="95.0%" stop-color="white" stop-opacity="0"/>
      <stop offset="97.5%" stop-color="white" stop-opacity="0"/>
      <stop offset="100.0%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <filter id="organic" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.003 0.008" numOctaves="1" seed="21" result="warp"/>
      <feDisplacementMap in="SourceGraphic" in2="warp" scale="64" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <!-- The filtered rect starts 80 units above the viewBox. The displacement
       samples up to 32 units away: from a rect starting at 0 it pulled empty
       space into the top rows and punched black notches along the top of the
       page. The gradient is anchored to the viewBox (userSpaceOnUse), so the
       extra band simply stays opaque and the falloff itself is unchanged. -->
  <rect x="-160" y="-80" width="1920" height="1104" fill="url(#falloff)" filter="url(#organic)"/>
</svg>
